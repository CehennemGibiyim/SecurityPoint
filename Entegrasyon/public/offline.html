<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecurityPoint — çevrimdışı</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #0d1526, #06080f 70%);
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      main { max-width: 30rem; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { color: #94a3b8; line-height: 1.6; margin: 0 0 18px; }
      button {
        background: #0ea5e9; color: #06121f; border: 0; border-radius: 10px;
        padding: 10px 18px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="brand/pwa-192.png" alt="SecurityPoint" />
      <h1>Bağlantı yok</h1>
      <p>
        Sunucuya ulaşılamıyor. Yerel kurulumda <strong>SecurityPoint-Başlat</strong> kısayolunu
        çalıştırın; ağ üzerinden kullanıyorsanız bağlantınızı kontrol edip tekrar deneyin.
      </p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
