# ============================================================
#  SecurityPoint sürüm yayını (Windows + Linux, GitHub Release)
#
#  Tetikleme: "v1.3.0" gibi bir etiket itildiğinde (git push origin v1.3.0)
#  Üretilenler:
#    SecurityPoint-Kurulum.exe            (Inno Setup, gömülü Node+PostgreSQL)
#    SecurityPoint-Portable.zip           (Windows taşınabilir)
#    SecurityPoint-Portable-linux-x64.tar.gz (Linux taşınabilir)
#    SHA256SUMS.txt
# ============================================================
name: SecurityPoint sürüm yayını

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Yayınlanacak sürüm (örn. 1.3.0) — etiket önceden itilmiş olmalı"
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: Entegrasyon

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      VERSION: ${{ inputs.version || github.ref_name }}
      P26_PG_SHA256: ${{ vars.P26_PG_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit --pretty false
      - run: npm run build

      - name: Windows paketleri (portable + kurulum .exe)
        shell: pwsh
        run: ./windows/paket-olustur.ps1 -SkipBuild -Version $env:VERSION -PgSha256 $env:P26_PG_SHA256

      # Artifact yolları çalışma alanı köküne göre çözülür; run adımları ise
      # defaults ile Entegrasyon/ içinde çalışır. Bu yüzden dosyalar ../dist'e taşınır.
      - name: Yayın dosyalarını hazırla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../dist/windows | Out-Null
          Copy-Item SecurityPoint-Portable.zip ../dist/windows/
          Copy-Item windows/SecurityPoint-Kurulum.exe ../dist/windows/
          Get-ChildItem ../dist/windows | Select-Object Name, Length | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: windows-distribution
          path: dist/windows/
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit --pretty false
      - run: npm run build

      # Ubuntu 22.04 varsayılanı 14; Windows paketiyle aynı ana sürüm için PGDG 16.
      - name: PostgreSQL 16 çalıştırıcılarını kur
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Linux taşınabilir paketi üret
        env:
          P26_APP_VERSION: ${{ inputs.version || github.ref_name }}
        run: ./linux/paket-olustur.sh --skip-build --pg-dir /usr/lib/postgresql/16

      - name: Paket içeriğini doğrula
        run: |
          set -euo pipefail
          TARBALL=SecurityPoint-Portable-linux-x64.tar.gz
          test -s "$TARBALL"
          # Not: `tar | grep -q` pipefail altında SIGPIPE ile düşer; liste dosyaya alınır.
          tar -tzf "$TARBALL" > /tmp/archive-list.txt
          for path in app/server.js node/bin/node pgsql/bin/postgres schema.sql \
                      schema-update.sql SecurityPoint-Yonet.sh SecurityPoint-Baslat.sh \
                      securitypoint.desktop brand/securitypoint.png manifest.json; do
            grep -qx "SecurityPoint-Portable/$path" /tmp/archive-list.txt \
              || { echo "Eksik dosya: $path" >&2; exit 1; }
          done
          for dir in app/public/models pgsql/lib app/.next/static; do
            grep -q "^SecurityPoint-Portable/$dir/" /tmp/archive-list.txt \
              || { echo "Eksik klasör: $dir" >&2; exit 1; }
          done
          echo "Arşiv içeriği doğrulandı: $(wc -l < /tmp/archive-list.txt) giriş"

      - name: Paketi açıp gömülü çalıştırıcıları dene
        run: |
          set -euo pipefail
          mkdir -p /tmp/p26 && tar -xzf SecurityPoint-Portable-linux-x64.tar.gz -C /tmp/p26
          cd /tmp/p26/SecurityPoint-Portable
          ./node/bin/node -v
          LD_LIBRARY_PATH="$PWD/pgsql/lib" ./pgsql/bin/postgres --version
          ./SecurityPoint-Yonet.sh doctor > /tmp/p26/doctor.txt 2>&1 || true
          tail -30 /tmp/p26/doctor.txt

      - name: Yayın dosyalarını hazırla
        run: |
          set -euo pipefail
          mkdir -p ../dist/linux
          cp SecurityPoint-Portable-linux-x64.tar.gz ../dist/linux/
          ls -l ../dist/linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-distribution
          path: dist/linux/
          retention-days: 7

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-distribution
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-distribution
          path: dist/linux

      - name: SHA-256 ve sürüm notları
        shell: bash
        # Sürüm notları ve dist/ çalışma alanının kökünde; defaults.Entegrasyon'u geçersiz kılar.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tag="v$version"
          echo "İndirilen yayın dosyaları:"; find dist -type f -printf '  %p (%s bayt)\n' | sort
          files=(
            "dist/windows/SecurityPoint-Kurulum.exe"
            "dist/windows/SecurityPoint-Portable.zip"
            "dist/linux/SecurityPoint-Portable-linux-x64.tar.gz"
          )
          for f in "${files[@]}"; do [ -s "$f" ] || { echo "Eksik yayın dosyası: $f" >&2; exit 1; }; done
          ( cd dist && sha256sum windows/SecurityPoint-Kurulum.exe windows/SecurityPoint-Portable.zip linux/SecurityPoint-Portable-linux-x64.tar.gz > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture=1 }
            capture && /^## \[/ && $0 !~ "^## \\[" v "\\]" { exit }
            capture { print }
          ' CHANGELOG.md > dist/notes.md || true
          [ -s dist/notes.md ] || echo "SecurityPoint $tag" > dist/notes.md
          {
            echo
            echo "### Doğrulama"
            echo "İndirdikten sonra SHA256SUMS.txt ile karşılaştırın:"
            echo
            echo '    Windows: Get-FileHash .\SecurityPoint-Kurulum.exe -Algorithm SHA256'
            echo '    Linux  : sha256sum -c SecurityPoint-Portable-linux-x64.tar.gz.sha256'
            echo
            echo "Kurulum dosyası kod imzalı değildir; SmartScreen ilk çalıştırmada uyarı gösterebilir."
          } >> dist/notes.md

          git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1 || echo "UYARI: $tag etiketi yok; yayın mevcut commit üzerinde açılacak."
          echo "$tag" > dist/tag.txt

      - name: GitHub Release oluştur / güncelle
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tag="$(cat dist/tag.txt)"
          assets=(
            "dist/windows/SecurityPoint-Kurulum.exe"
            "dist/windows/SecurityPoint-Portable.zip"
            "dist/linux/SecurityPoint-Portable-linux-x64.tar.gz"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag zaten var; dosyalar güncelleniyor."
            gh release upload "$tag" "${assets[@]}" --clobber
          elif git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${assets[@]}" --title "SecurityPoint $tag" --notes-file dist/notes.md
          else
            gh release create "$tag" "${assets[@]}" --title "SecurityPoint $tag" --notes-file dist/notes.md --target "$GITHUB_SHA"
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | " - " + .name)'
