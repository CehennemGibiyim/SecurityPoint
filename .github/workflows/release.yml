# ============================================================
#  Windows sürüm yayını (GitHub Release)
#
#  Tetikleme: "v1.2.0" gibi bir etiket itildiğinde (git push origin v1.2.0)
#  Üretilenler: Personel26-Kurulum.exe, Personel26-Portable.zip, SHA256SUMS.txt
#  Sürüm numarası etiketten (veya elle tetiklemede girdiden) gelir ve
#  paketleyiciye -Version ile aktarılır; package.json ile aynı olmalıdır.
# ============================================================
name: Windows sürüm yayını

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Yayınlanacak sürüm (örn. 1.2.0) — etiket önceden itilmiş olmalı"
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: Entegrasyon

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version || github.ref_name }}
      # İsteğe bağlı: PostgreSQL arşiv özetini depo değişkeni olarak sabitleyin.
      P26_PG_SHA256: ${{ vars.P26_PG_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Next.js tiplerini üret
        run: npx next typegen

      - name: TypeScript kontrolü
        run: npx tsc --noEmit --pretty false

      - name: Üretim derlemesi
        run: npm run build

      - name: Taşınabilir paket ve kurulum .exe üret
        shell: pwsh
        run: ./windows/paket-olustur.ps1 -SkipBuild -Version $env:VERSION -PgSha256 $env:P26_PG_SHA256

      - name: Sürüm notları ve SHA-256 özetleri
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v','V')
          $tag = "v$version"

          # Etiket yoksa (elle tetikleme) yayin workflow'un calistigi commit uzerinde acilir.
          git rev-parse --verify "refs/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "UYARI: $tag etiketi yok; yayin $env:GITHUB_SHA uzerinde olusturulacak." -ForegroundColor Yellow }

          $files = @('Personel26-Portable.zip', 'windows\Personel26-Kurulum.exe')
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Yayin dosyasi bulunamadi: $f" } }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding ascii

          # CHANGELOG.md icindeki ilgili surum bolumu not olarak kullanilir.
          $changelog = Get-Content '../CHANGELOG.md' -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\].*?(?=\r?\n## \[|\z)"
          $notes = if ($changelog -match $pattern) { $Matches[0].Trim() } else { "## [$version]" }
          $notes = $notes + "`n`n### Dogrulama`nIndirdikten sonra SHA256SUMS.txt ile karsilastirin:`n`n    Get-FileHash .\Personel26-Kurulum.exe -Algorithm SHA256`n"
          $notes | Set-Content 'release-notes.md' -Encoding utf8

          if (Test-Path 'Personel26-Portable\manifest.json') { Get-Content 'Personel26-Portable\manifest.json' -Raw | Write-Host }

      - name: GitHub Release oluştur
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v','V')
          $tag = "v$version"
          $assets = @('Personel26-Portable.zip', 'windows\Personel26-Kurulum.exe', 'SHA256SUMS.txt')

          git rev-parse --verify "refs/tags/$tag" 2>$null | Out-Null
          $tagExists = ($LASTEXITCODE -eq 0)

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag zaten var; dosyalar guncelleniyor."
            gh release upload $tag @assets --clobber
          } elseif ($tagExists) {
            gh release create $tag @assets --title "Personel26 $tag" --notes-file release-notes.md
          } else {
            gh release create $tag @assets --title "Personel26 $tag" --notes-file release-notes.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release olusturulamadi." }
          Write-Host "Yayin tamamlandi: $tag"
